<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
  <style>
    path, line {
      stroke: #000000;
    }
    @media (prefers-color-scheme: dark) {
      path, line {
        stroke: #ffffff;
      }
    }
  </style>
  <!-- Futuristic JF Monogram -->
  <!-- J -->
  <path d="M 45 20 L 45 75 C 45 85, 30 85, 30 75" />
  <!-- Top bar of J overlapping F slightly -->
  <line x1="25" y1="20" x2="65" y2="20" />
  <!-- F -->
  <path d="M 60 20 L 60 80" />
  <!-- F middle bar -->
  <line x1="60" y1="50" x2="80" y2="50" />
</svg>
